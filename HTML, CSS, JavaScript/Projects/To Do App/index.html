<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: solid black 2px;
            border-radius: 25px;
            padding: 25px;
            height: 500px;
            width: 25%;
        }
    </style>
</head>
<body>
    <main>
            <h1>Todo App</h1>
            <div class="wrapper">
                <form action="">
                    <input id="todo-input" name="todo" type="text" placeholder="enter text here">
                    <button class="add-button">Add</button>
                </form>
                <ul id="todo-list">
                    <li class="todo">
                        <input type="checkbox" id="todo-1">
                        <label class="custom-checkbox" for="todo-1"> Testing</label>
                        <button class="delete-button">Delete</button>
                    </li>
                </ul>
            </div>
            

    </main>
    
    <footer>

    </footer>

    <script src="./script.js"></script>
</body>
</html>
